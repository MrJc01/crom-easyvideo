services:
  crom-easyvideo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crom-easyvideo
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      - PORT=5174
      - NODE_ENV=production
    volumes:
      - ./video-project-template:/app/video-project-template
      - ./meus_videos:/app/meus_videos
